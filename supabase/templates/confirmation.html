<!--
  "Confirm signup" email (Spanish). The same HTML goes in the hosted project:
  Supabase dashboard > Authentication > Emails > Confirm sign up.
  The link goes to /auth/confirm (a page with a button) with the one-time token hash;
  {{ .RedirectTo }} is the emailRedirectTo passed by the signup action.
-->
<div style="font-family: Arial, Helvetica, sans-serif; background: #fff8ee; padding: 32px 16px;">
  <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 32px; color: #35352d;">
    <h1 style="font-size: 22px; margin: 0 0 16px;">Confirma tu correo</h1>
    <p style="font-size: 15px; line-height: 1.6; margin: 0 0 24px;">
      Gracias por crear tu cuenta en emblemático. Confirma tu correo para
      activarla y empezar tu prueba gratuita.
    </p>
    <p style="margin: 0 0 24px;">
      <a
        href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
        style="display: inline-block; background: #d4a862; color: #35352d; text-decoration: none; font-weight: bold; padding: 14px 28px; border-radius: 999px;"
      >
        Confirmar mi correo
      </a>
    </p>
    <p style="font-size: 13px; line-height: 1.6; color: #6b6b60; margin: 0;">
      Si no creaste esta cuenta, puedes ignorar este mensaje.
    </p>
  </div>
</div>
